<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포탈</title>
  </head>
  <body>
    <h1>포탈</h1>
    <a href="hanmogm://hanmogm.com/" onclick="onClickIOSApp()">
      한모금 실행하기 iOS
    </a>
    <a
      href="intent://hanmogm.com/path1/path2/#Intent;scheme=hanmogm;package=com.hanmogm.hanmogm;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.hanmogm.hanmogm;end"
    >
      한모금 실행하기 Android
    </a>
    <script>
      function onClickIOSApp() {
        const storeUrl =
          'https://apps.apple.com/us/app/%ED%95%9C%EB%AA%A8%EA%B8%88-hanmogm/id6502346193';

        let didHide = false;
        function onVisibilityChange() {
          if (document.hidden) {
            didHide = true;
          }
        }

        document.addEventListener('visibilitychange', onVisibilityChange);
        setTimeout(() => {
          document.removeEventListener('visibilitychange', onVisibilityChange);
          if (!didHide) {
            window.location.href = storeUrl;
          }
        }, 1500);
      }
    </script>
  </body>
</html>
